# POC: 让 dsh 接入我们本地部署的模型（Ollama，OpenAI 兼容端点）
# 用法: dsh --profile headless --patch ./patch-local-ollama.yml "<任务文本>"
# 顶层必须是 loader patch entries 数组（与 --dump-config 同构）
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      local-ollama:
        displayName: Local Ollama
        apiKeyEnv: OLLAMA_API_KEY
        api: openai-completions
        baseURL: http://localhost:11434/v1
        # Ollama 未实现 OpenAI 的 role:"developer" / max_completion_tokens，需显式兼容
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: qwen2.5vl:7b
            name: Local Qwen2.5 VL 7B
            contextWindow: 32768
            maxTokens: 4096
          - id: mistral-nemo:12b
            name: Local Mistral-Nemo 12B
            contextWindow: 32768
            maxTokens: 4096
          - id: llama3.1:8b
            name: Local Llama 3.1 8B
            contextWindow: 8192
            maxTokens: 4096
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: local-ollama
    model: mistral-nemo:12b