# LocalFlow AI — electron-builder 打包配置
# 用法: cd desktop && npx electron-builder --config electron-builder.yml [--mac|--win|--linux]
#
# 打包前提：先构建 Python 后端（PyInstaller），产物位于 ../backend/dist/localflow-backend/
#   cd backend && pip install -r requirements.txt pyinstaller && pyinstaller localflow-backend.spec
# 该后端目录会作为 extraResources 随应用分发，Electron 启动时自动拉起（见 src/main/main.js）。

appId: ai.localflow.app
productName: LocalFlow AI
copyright: Copyright © 2025 LocalFlow AI Team
electronVersion: 30.0.0

directories:
  output: dist
  buildResources: build

files:
  - src/**
  - package.json

# 携带打包好的 Python 后端（PyInstaller 产物：单目录可执行）
extraResources:
  - from: ../backend/dist/localflow-backend
    to: backend
    filter:
      - "**/*"
  # 内置 DeepSeek Harness（dsh）实现「下载即用、零安装」：由 scripts/bundle-dsh.mjs
  # 产出的自包含 dsh 目录（node_modules + dsh-home 模板），已 patch 掉绝对路径。
  - from: build/dsh-bundle
    to: dsh
    filter:
      - "**/*"
  # 内置便携式 Node 运行时，供主进程拉起 dsh（dsh 要求 >=22.19.0，系统未装 Node 也能跑）。
  - from: build/node-bundle
    to: node
    filter:
      - "**/*"

# ── Windows ──────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: "${productName}-Setup-${version}-Windows-${arch}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: LocalFlow AI

# ── macOS ────────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
  darkModeSupport: true
  icon: build/icon.icns
  artifactName: "${productName}-${version}-macOS-${arch}.${ext}"
  # 签名 / 公证（需 Apple Developer 凭据）：
  #   1) 提供 CSC_LINK(p12) + CSC_KEY_PASSWORD 让 electron-builder 完成 Developer ID 签名；
  #   2) 把下方 identity 改为 "Developer ID Application: <团队名> (<TEAM_ID>)"（缺省留空则跳过签名）；
  #   3) 公证用 electron-builder v24 内置 notarize 选项（底层仍是 @electron/notarize），
  #      读取 CI 透传的 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 环境变量。
  # 测试阶段走 Gatekeeper 绕行，notarize 设为 false 跳过公证；购买 Apple Developer 账号后
  # 改为 true 即自动公证。该 dmg 在他人 Mac 上首次打开会被 Gatekeeper 拦截（需右键→打开 或 xattr 解除）。
  # 注：afterSign 钩子在 electron-builder v22+ 已从 mac 段移除，故改用内置 notarize。
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 发版前把下面尖括号内容替换为真实值，例如：
  #   identity: "Developer ID Application: Zhang San (ABCDE12345)"
  # 当前（测试阶段）走 Gatekeeper 绕行方案、暂不购买 Apple Developer 账号，故 identity 设为 null：
  #   macOS 构建会跳过签名、正常产出未签名 dmg（Mac 用户靠 README 顶部「macOS 用户必读」绕行打开）。
  # 测试阶段未购买 Apple Developer 账号：改用 ad-hoc 签名（-）让嵌套辅助进程带上
  # entitlements（disable-library-validation / allow-jit 等），避免 macOS 26 上渲染/GPU
  # 进程因库校验失败而崩溃（SIGABRT）。代价：Gatekeeper 仍会拦，需 xattr -rd 解除隔离。
  # 购号并配好 CSC_LINK / Apple 凭据后，把下行改为真实证书名即可启用 Developer ID 签名+公证
  # （彻底消除“已损坏”弹窗与渲染崩溃）：
  # identity: "Developer ID Application: <在此填团队名> (<TEAM_ID>)"
  identity: -

dmg:
  title: "${productName} ${version}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ── Linux ────────────────────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
  icon: build/icon.png
  maintainer: LocalFlow AI Team <dev@localflow.ai>
  artifactName: "${productName}-${version}-Linux-${arch}.${ext}"

# 发布说明：GitHub Actions（.github/workflows/build.yml）负责构建产物与
# Release 创建（electron-builder 使用 --publish never，不在此处发布）。

# v0.1.0 不启用自动更新；显式指定 github provider 仅为让 electron-builder
# 在生成 update-info 时不再读取 null.provider 而报错（build.yml 已用
# --publish never 阻止实际上传到 Release）。
publish:
  - provider: github
