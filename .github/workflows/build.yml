name: Build & Release

# 触发方式：
#   1. 推送 tag（如 v0.1.0）→ 自动构建并发布到 GitHub Releases（产物见下）
#   2. 手动触发（Actions 页 → Run workflow）→ 仅构建并上传 artifacts，不发布
# 矩阵说明：当前仅 macos-arm64 / windows / linux 三路。
#   - macos-13（Intel x64）runner 在公开仓库排队极久（实测 3.5h+ 未 pickup），已移除；
#   - 但 macOS 的 Intel dmg 仍由 electron-builder 在 arm64 runner 上交叉编译产出
#     （见 electron-builder.yml 的 mac.target.arch: [arm64, x64]），Intel Mac 用户不受影响。
#   若日后确实需要独立 Intel runner（如签名/公证差异），可恢复下方 macos-13 矩阵项。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon（arm64）
            arch: arm64
            label: macos-arm64
          - os: windows-2022
            arch: x64
            label: windows-x64
          - os: ubuntu-22.04
            arch: x64
            label: linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tag 与 release notes 需要完整历史

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Build Python backend (PyInstaller)
        working-directory: backend
        shell: bash
        run: |
          pip install -r requirements.txt pyinstaller 2>/dev/null \
            || pip install --break-system-packages -r requirements.txt pyinstaller
          pyinstaller --clean --noconfirm localflow-backend.spec
          test -f dist/localflow-backend/localflow-backend \
            -o -f dist/localflow-backend/localflow-backend.exe
          echo "后端打包完成: $(ls dist/localflow-backend | wc -l) 个文件"

      - name: Run backend unit tests
        working-directory: backend
        shell: bash
        run: |
          pip install pytest 2>/dev/null || pip install --break-system-packages pytest
          # 仅跑不依赖外部服务的单元测试；test_openai_key.py 需活后端，手动运行
          PYTHONPATH=. python -m pytest tests/test_react_agent.py tests/test_sandbox.py -q

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      # 内置 DeepSeek Harness（dsh）实现「下载即用、离线零安装」：
      #   1) 先在 dsh-poc/ 下按 pnpm lockfile 装好依赖（Node 22，与内置便携 Node 版本一致，
      #      保证 node-pty 等原生模块 ABI 匹配）；
      #   2) 再由 scripts/bundle-dsh.mjs 物化为自包含资源 desktop/build/{dsh-bundle,node-bundle}，
      #      electron-builder 随后把它们放进安装包 resources/dsh 与 resources/node。
      - name: Install dsh-poc dependencies (pnpm workspace)
        working-directory: dsh-poc
        shell: bash
        run: |
          npm i -g pnpm@10
          pnpm --version
          pnpm install --no-frozen-lockfile --reporter=append-only

      - name: Bundle dsh and portable Node runtime
        working-directory: desktop
        shell: bash
        run: |
          node scripts/bundle-dsh.mjs
          test -d build/dsh-bundle || (echo "::error::dsh-bundle 未生成" && exit 1)
          test -f build/node-bundle/node -o -f build/node-bundle/node.exe \
            || (echo "::error::node-bundle 未生成" && exit 1)

      - name: Package with electron-builder
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 测试阶段不签名/不公证：不传递任何代码签名凭据（CSC_LINK/WIN_CSC_LINK/APPLE_*）。
          # 等购买 Apple Developer 账号并准备好 Windows 代码签名证书后，再在此映射
          # CSC_LINK / CSC_KEY_PASSWORD（Windows Authenticode）与
          # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID（macOS 公证），
          # 并把 electron-builder.yml 的 mac.identity / notarize 改为启用值。
          # ⚠️ 若仓库 Secrets 或 Environment 里残留了指向目录（非证书文件）的
          # CSC_LINK / WIN_CSC_LINK，请一并删除，否则 Windows 构建会报
          # "Env WIN_CSC_LINK is not correct, cannot resolve: ... not a file"。
        run: |
          case "${{ matrix.os }}" in
            macos-*)
              npx electron-builder --config electron-builder.yml --mac --${{ matrix.arch }} --publish never ;;
            windows-2022)
              npx electron-builder --config electron-builder.yml --win --x64 --publish never ;;
            *)
              npx electron-builder --config electron-builder.yml --linux --x64 --publish never ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: localflow-${{ matrix.label }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
