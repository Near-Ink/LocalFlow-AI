name: Build & Release

# 触发方式：
#   1. 推送 tag（如 v0.1.0）→ 自动构建四路产物并发布到 GitHub Releases
#   2. 手动触发（Actions 页 → Run workflow）→ 仅构建并上传 artifacts，不发布
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon（arm64）
            arch: arm64
            label: macos-arm64
          - os: macos-13          # Intel（x64）
            arch: x64
            label: macos-x64
          - os: windows-2022
            arch: x64
            label: windows-x64
          - os: ubuntu-22.04
            arch: x64
            label: linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tag 与 release notes 需要完整历史

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Build Python backend (PyInstaller)
        working-directory: backend
        shell: bash
        run: |
          pip install -r requirements.txt pyinstaller 2>/dev/null \
            || pip install --break-system-packages -r requirements.txt pyinstaller
          pyinstaller --clean --noconfirm localflow-backend.spec
          test -f dist/localflow-backend/localflow-backend \
            -o -f dist/localflow-backend/localflow-backend.exe
          echo "后端打包完成: $(ls dist/localflow-backend | wc -l) 个文件"

      - name: Run backend unit tests
        working-directory: backend
        shell: bash
        run: |
          pip install pytest 2>/dev/null || pip install --break-system-packages pytest
          # 仅跑不依赖外部服务的单元测试；test_openai_key.py 需活后端，手动运行
          PYTHONPATH=. python -m pytest tests/test_react_agent.py tests/test_sandbox.py -q

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Package with electron-builder
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # 无签名证书时跳过 macOS 代码签名
        run: |
          case "${{ matrix.os }}" in
            macos-*)
              npx electron-builder --config electron-builder.yml --mac --${{ matrix.arch }} --publish never ;;
            windows-2022)
              npx electron-builder --config electron-builder.yml --win --x64 --publish never ;;
            *)
              npx electron-builder --config electron-builder.yml --linux --x64 --publish never ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: localflow-${{ matrix.label }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
